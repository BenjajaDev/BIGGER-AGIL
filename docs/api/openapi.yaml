openapi: 3.1.0
info:
  title: BIGGER Ágil API
  version: 0.1.0
  description: |
    API REST del sistema de comandas, cocina y carta digital de BIGGER.

    **Convenciones**
    - Prefijo: `/api/v1`. Montos en pesos chilenos enteros (`priceClp`, `totalClp`).
    - Éxito: `{ "data": ... }`. Error: `{ "error": { "code", "message", "issues?" } }`.
    - Fechas en ISO 8601 (UTC). Las vigencias de promoción son fechas sin hora (`YYYY-MM-DD`)
      y se evalúan en la zona horaria del local (`BUSINESS_TIMEZONE`, por defecto
      America/Santiago).
    - Imágenes: se suben como cuerpo binario (`POST /admin/images`), el servidor las re-codifica
      a WebP sin metadatos y se sirven en `/media/<id>-card.webp` (1200 px) y
      `/media/<id>-thumb.webp` (480 px), con caché inmutable de un año.
    - Las mutaciones van por REST; los cambios se notifican por SSE (`GET /events`).

    Las operaciones marcadas `x-status: planned` forman parte del contrato acordado y se
    implementan en la Fase 2.

    **Seguridad:** las rutas `/admin/*` (configuración de la carta) exigen la cookie de sesión
    `bigger_admin` (httpOnly, SameSite=Strict) obtenida con el PIN del encargado en
    `POST /admin/session`; tras 5 PIN incorrectos se bloquea 15 min (429). El resto de las rutas
    internas aún no exige autenticación y corre solo en la red del local; la Fase 2 agrega
    autenticación por dispositivo. `/menu` es pública.
  license:
    name: Propietario · uso exclusivo de BIGGER
    identifier: LicenseRef-Proprietary
security: []
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
tags:
  - name: Sistema
    description: Salud del servicio.
  - name: Catálogo
    description: Productos y categorías; alimenta la toma de pedidos y la carta pública.
  - name: Mesas
    description: Mapa del salón con estado derivado de los pedidos.
  - name: Pedidos
    description: Comandas de mesa, para llevar y WhatsApp.
  - name: Tiempo real
    description: Notificaciones de cambios por Server-Sent Events.
  - name: Administración
    description: Sesión del encargado y configuración de la carta (requiere PIN).
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio
      operationId: getHealth
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: ok }

  /categories:
    get:
      tags: [Catálogo]
      summary: Lista las categorías en orden de presentación
      operationId: listCategories
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Category' } }

  /products:
    get:
      tags: [Catálogo]
      summary: Lista productos activos con sus personalizaciones y espacios de combo
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: onlyAvailable
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MenuProduct' } }
        '400': { $ref: '#/components/responses/ValidationError' }

  /menu:
    get:
      tags: [Catálogo]
      summary: Carta pública (solo productos disponibles, agrupados por categoría)
      description: Alimenta la carta digital accesible por QR. No requiere autenticación.
      operationId: getPublicMenu
      responses:
        '200':
          description: Carta
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Menu' }

  /tables:
    get:
      tags: [Mesas]
      summary: Mapa de mesas con su estado derivado de los pedidos abiertos
      operationId: listTables
      responses:
        '200':
          description: Mesas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TableOverview' } }

  /orders:
    get:
      tags: [Pedidos]
      summary: Lista pedidos (más antiguos primero)
      operationId: listOrders
      parameters:
        - name: status
          in: query
          description: Estados separados por coma, p. ej. `new,preparing,ready`.
          schema: { type: string, example: 'new,preparing,ready' }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/OrderChannel' }
      responses:
        '200':
          description: Pedidos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Pedidos]
      summary: Envía una comanda a cocina (prueba P02)
      description: |
        El cliente envía solo ids; el servidor toma nombre y precio vigentes del catálogo
        (snapshot del producto y de cada opción y elección de combo), calcula el total
        (base + extras) y emite `order.created` por SSE. Un pedido `takeaway` exige
        `customerName`. Un producto u opción no disponible, archivado o ajeno al producto se
        rechaza con `VALIDATION_ERROR` indicando el campo exacto (`items.0.options.0`).
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderInput' }
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /orders/{orderId}/status:
    patch:
      tags: [Pedidos]
      summary: Avanza el estado de un pedido (prueba P03)
      description: |
        Transiciones válidas: `new → preparing → ready → delivered → paid`;
        `new|preparing → cancelled`. Valida el UUID y el cuerpo de la solicitud.
        Actualiza `status` y `updatedAt` en SQLite conservando los demás datos del pedido.
        La escritura está condicionada al estado leído: si otro cliente lo cambia entre
        la lectura y la escritura, responde 409 `CONFLICT` sin reintentar.
        Una transición no permitida, incluido repetir el estado actual, responde 409
        `INVALID_STATE_TRANSITION`. Devuelve el pedido completo actualizado y emite
        `order.updated` por SSE únicamente después de confirmar la escritura.
      operationId: updateOrderStatus
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transición no permitida (`INVALID_STATE_TRANSITION`) o actualización concurrente (`CONFLICT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /events:
    get:
      tags: [Tiempo real]
      summary: Flujo Server-Sent Events con cambios de pedidos
      description: |
        Cada mensaje `data:` contiene un `RealtimeEvent` en JSON. El servidor envía un
        comentario `: ping` cada 25 s y sugiere reconectar a los 3 s (`retry: 3000`).
      operationId: streamEvents
      responses:
        '200':
          description: Flujo abierto
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RealtimeEvent' }

  /admin/session:
    post:
      tags: [Administración]
      summary: Inicia sesión con el PIN del encargado
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^\d{4,12}$' }
      responses:
        '200':
          description: Sesión iniciada; responde con la cookie `bigger_admin`
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Demasiados intentos (`TOO_MANY_REQUESTS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    get:
      tags: [Administración]
      summary: Estado de la sesión actual
      operationId: adminSession
      responses:
        '200':
          description: Estado de la sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionResponse' }
    delete:
      tags: [Administración]
      summary: Cierra la sesión
      operationId: adminLogout
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionResponse' }

  /admin/categories:
    get:
      tags: [Administración]
      summary: Lista categorías con su cantidad de productos activos
      operationId: adminListCategories
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IncludeArchived' }]
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminCategory' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Administración]
      summary: Crea una categoría (el slug se genera desde el nombre)
      operationId: adminCreateCategory
      security: [{ adminSession: [] }]
      requestBody: { $ref: '#/components/requestBodies/CategoryInput' }
      responses:
        '201': { $ref: '#/components/responses/AdminCategory' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Administración]
      summary: Cambia nombre y foto de una categoría (el slug no cambia)
      operationId: adminUpdateCategory
      security: [{ adminSession: [] }]
      requestBody: { $ref: '#/components/requestBodies/CategoryInput' }
      responses:
        '200': { $ref: '#/components/responses/AdminCategory' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Administración]
      summary: Elimina (archiva) una categoría sin productos activos
      operationId: adminArchiveCategory
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Administración]
      summary: Restaura una categoría eliminada
      operationId: adminRestoreCategory
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/products:
    get:
      tags: [Administración]
      summary: Lista productos y combos
      operationId: adminListProducts
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IncludeArchived' }]
      responses:
        '200':
          description: Productos y combos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Administración]
      summary: Crea un producto o un combo (prueba P01)
      description: |
        `kind: single` acepta tamaños con precio propio y reglas por tamaño, alérgenos y
        personalizaciones; `kind: combo` acepta espacios obligatorios u opcionales con productos
        simples a elección. Ambos aceptan tipo (plantilla), foto y promoción. Los errores de
        validación indican el campo exacto, p. ej. `sizes.1.groupRules.0.maxSelections` o
        `comboSlots.0.options.1.productId`. Emite `catalog.updated` por SSE.
      operationId: adminCreateProduct
      security: [{ adminSession: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProductInput' }
      responses:
        '201': { $ref: '#/components/responses/AdminProduct' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Administración]
      summary: Detalle de un producto o combo
      operationId: adminGetProduct
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Administración]
      summary: Reemplaza la configuración completa de un producto o combo
      operationId: adminUpdateProduct
      security: [{ adminSession: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProductInput' }
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Administración]
      summary: Elimina (archiva) un producto
      description: |
        Borrado lógico: desaparece de la carta y de Pedido, pero las comandas pasadas lo siguen
        referenciando. Responde 409 si el producto es opción de un combo activo.
      operationId: adminArchiveProduct
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/products/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Administración]
      summary: Restaura un producto eliminado
      operationId: adminRestoreProduct
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/modifier-groups:
    get:
      tags: [Administración]
      summary: Lista personalizaciones reutilizables
      operationId: adminListModifierGroups
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Personalizaciones
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminModifierGroup' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Administración]
      summary: Crea una personalización
      operationId: adminCreateModifierGroup
      security: [{ adminSession: [] }]
      requestBody: { $ref: '#/components/requestBodies/ModifierGroupInput' }
      responses:
        '201': { $ref: '#/components/responses/AdminModifierGroup' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/modifier-groups/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Administración]
      summary: Detalle de una personalización
      operationId: adminGetModifierGroup
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminModifierGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Administración]
      summary: Reemplaza nombre, regla y opciones (conserva el id de las opciones enviadas con id)
      operationId: adminUpdateModifierGroup
      security: [{ adminSession: [] }]
      requestBody: { $ref: '#/components/requestBodies/ModifierGroupInput' }
      responses:
        '200': { $ref: '#/components/responses/AdminModifierGroup' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Administración]
      summary: Elimina la personalización y la quita de todos los productos
      operationId: adminDeleteModifierGroup
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminModifierGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/images:
    post:
      tags: [Administración]
      summary: Sube una foto para una tarjeta de producto o categoría
      description: |
        El cuerpo es el archivo (no multipart). El servidor valida el contenido real, lo
        re-codifica a WebP en dos tamaños y descarta los metadatos (EXIF, ubicación). La foto
        se asocia al guardar el producto o la categoría con `image.imageId`.
      operationId: adminUploadImage
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary, maxLength: 8388608 } }
          image/png: { schema: { type: string, format: binary, maxLength: 8388608 } }
          image/webp: { schema: { type: string, format: binary, maxLength: 8388608 } }
      responses:
        '201':
          description: Foto procesada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UploadedImage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /admin/product-types:
    get:
      tags: [Administración]
      summary: Lista los tipos de producto (plantillas)
      operationId: adminListProductTypes
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: Tipos de producto
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ProductType' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Administración]
      summary: Crea un tipo de producto
      description: |
        Un tipo prellena un producto nuevo: tamaños con precio sugerido, personalizaciones con
        reglas por tamaño o espacios de combo. Los productos creados con él siguen siendo
        editables y no cambian si el tipo cambia después.
      operationId: adminCreateProductType
      security: [{ adminSession: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProductTypeInput' }
      responses:
        '201': { $ref: '#/components/responses/ProductType' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/product-types/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Administración]
      summary: Detalle de un tipo de producto
      operationId: adminGetProductType
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProductType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Administración]
      summary: Reemplaza la configuración de un tipo (no afecta a productos existentes)
      operationId: adminUpdateProductType
      security: [{ adminSession: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProductTypeInput' }
      responses:
        '200': { $ref: '#/components/responses/ProductType' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Administración]
      summary: Elimina un tipo; sus productos quedan sin tipo y conservan su configuración
      operationId: adminDeleteProductType
      security: [{ adminSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProductType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /media/{file}:
    get:
      tags: [Catálogo]
      summary: Archivo de imagen optimizado (público, inmutable)
      operationId: getMedia
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f-]{36}-(card|thumb)\\.webp$' }
      responses:
        '200':
          description: Imagen WebP
          content:
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: bigger_admin
      description: Cookie httpOnly emitida por `POST /admin/session`; dura 12 h.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncludeArchived:
      name: includeArchived
      in: query
      description: Incluye los elementos eliminados (archivados).
      schema: { type: string, enum: ['true', 'false'], default: 'false' }

  requestBodies:
    CategoryInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 60 }
              image:
                oneOf:
                  - $ref: '#/components/schemas/ImageRefInput'
                  - type: 'null'
                default: null
    ProductInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductInput' }
    ModifierGroupInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ModifierGroupInput' }
    ProductTypeInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductTypeInput' }

  responses:
    ValidationError:
      description: Datos de entrada inválidos (`VALIDATION_ERROR`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Recurso no encontrado (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Falta la sesión de administración o el PIN es incorrecto (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: La acción contradice el estado actual (`CONFLICT`), p. ej. nombre repetido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: La foto supera los 8 MB (`PAYLOAD_TOO_LARGE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ProductType:
      description: Tipo de producto
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ProductType' }
    AdminCategory:
      description: Categoría
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminCategory' }
    AdminProduct:
      description: Producto o combo
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminProduct' }
    AdminModifierGroup:
      description: Personalización
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/AdminModifierGroup' }

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_ERROR,
                  UNAUTHORIZED,
                  NOT_FOUND,
                  CONFLICT,
                  INVALID_STATE_TRANSITION,
                  PAYLOAD_TOO_LARGE,
                  TOO_MANY_REQUESTS,
                  INTERNAL_ERROR,
                ]
            message: { type: string }
            issues:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string }
                  message: { type: string }

    Allergen:
      type: string
      enum: [gluten, lacteos, huevo, frutos-secos, soya]

    ImageAsset:
      type: object
      description: |
        Foto subida. El cliente arma la URL desde el id (`/media/<id>-card.webp`,
        `/media/<id>-thumb.webp`).
      required: [id, width, height, focusY]
      properties:
        id: { type: string, format: uuid }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        focusY:
          type: integer
          minimum: 0
          maximum: 100
          description: Encuadre vertical al recortar la tarjeta (0 = arriba, 100 = abajo).

    UploadedImage:
      type: object
      required: [id, width, height]
      properties:
        id: { type: string, format: uuid }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }

    ImageRefInput:
      type: object
      required: [imageId, focusY]
      properties:
        imageId: { type: string, format: uuid }
        focusY: { type: integer, minimum: 0, maximum: 100 }

    SizeGroupRule:
      type: object
      description: |
        Regla de una personalización en un tamaño («Grande: 1 proteína»). Reemplaza el mínimo y
        máximo del grupo; `maxSelections = 0` significa que no se ofrece en ese tamaño.
      required: [groupId, minSelections, maxSelections]
      properties:
        groupId: { type: string, format: uuid }
        minSelections: { type: integer, minimum: 0, maximum: 10 }
        maxSelections: { type: integer, minimum: 0, maximum: 10 }

    ProductSize:
      type: object
      required: [id, name, priceClp, groupRules]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 30 }
        priceClp: { type: integer, minimum: 0 }
        groupRules: { type: array, items: { $ref: '#/components/schemas/SizeGroupRule' } }

    SizeInput:
      type: object
      required: [name, priceClp, groupRules]
      properties:
        id:
          type: string
          format: uuid
          description: Envíalo al editar para conservar la identidad del tamaño.
        name: { type: string, minLength: 1, maxLength: 30 }
        priceClp: { type: integer, minimum: 0, maximum: 1000000 }
        groupRules:
          type: array
          maxItems: 10
          description: Solo personalizaciones asignadas al producto, una vez por tamaño.
          items: { $ref: '#/components/schemas/SizeGroupRule' }

    Promotion:
      type: object
      description: Destacado en «Promociones» mientras hoy esté dentro de las fechas (opcionales).
      required: [startsOn, endsOn]
      properties:
        startsOn: { type: [string, 'null'], format: date }
        endsOn: { type: [string, 'null'], format: date, description: '≥ startsOn' }

    Category:
      type: object
      required: [id, slug, name, sortOrder, image]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        name: { type: string, maxLength: 60 }
        sortOrder: { type: integer, minimum: 0 }
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageAsset'
            - type: 'null'

    Product:
      type: object
      required:
        [
          id,
          categoryId,
          typeId,
          kind,
          name,
          subtitle,
          description,
          priceClp,
          allergens,
          isAvailable,
          sortOrder,
          image,
          sizes,
          promotion,
        ]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        typeId: { type: [string, 'null'], format: uuid, description: Tipo con que se creó }
        kind: { type: string, enum: [single, combo] }
        name: { type: string, maxLength: 80 }
        subtitle: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 240 }
        priceClp:
          type: integer
          minimum: 0
          description: Con tamaños, el precio del tamaño más barato («desde»).
        allergens:
          type: array
          description: En un combo, unión de los alérgenos de los productos que puede incluir.
          items: { $ref: '#/components/schemas/Allergen' }
        isAvailable: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageAsset'
            - type: 'null'
        sizes: { type: array, items: { $ref: '#/components/schemas/ProductSize' } }
        promotion:
          description: En la carta pública solo viene si la promoción está vigente hoy.
          oneOf:
            - $ref: '#/components/schemas/Promotion'
            - type: 'null'

    ModifierOption:
      type: object
      required: [id, name, priceDeltaClp, isAvailable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 40 }
        priceDeltaClp: { type: integer, minimum: 0 }
        isAvailable: { type: boolean }

    ModifierGroup:
      type: object
      description: Personalización reutilizable; `minSelections ≥ 1` la hace obligatoria.
      required: [id, name, minSelections, maxSelections, options]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 40 }
        minSelections: { type: integer, minimum: 0, maximum: 10 }
        maxSelections: { type: integer, minimum: 1, maximum: 10 }
        options: { type: array, items: { $ref: '#/components/schemas/ModifierOption' } }

    ComboSlot:
      type: object
      description: |
        Una elección dentro del combo («Churrasco a elección»). Un espacio opcional puede quedar
        vacío; en la carta se ocultan los espacios opcionales sin opciones disponibles y los
        combos con un espacio obligatorio sin opciones.
      required: [id, name, isRequired, options]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 40 }
        isRequired: { type: boolean }
        options:
          type: array
          items:
            type: object
            required: [productId, productName, extraPriceClp, isAvailable, allergens]
            properties:
              productId: { type: string, format: uuid }
              productName: { type: string }
              extraPriceClp: { type: integer, minimum: 0 }
              isAvailable: { type: boolean }
              allergens: { type: array, items: { $ref: '#/components/schemas/Allergen' } }

    MenuProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [modifierGroups, comboSlots]
          properties:
            modifierGroups: { type: array, items: { $ref: '#/components/schemas/ModifierGroup' } }
            comboSlots: { type: array, items: { $ref: '#/components/schemas/ComboSlot' } }

    AdminCategory:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [archivedAt, activeProductCount]
          properties:
            archivedAt: { type: [string, 'null'], format: date-time }
            activeProductCount: { type: integer, minimum: 0 }

    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [archivedAt, modifierGroupIds, comboSlots]
          properties:
            archivedAt: { type: [string, 'null'], format: date-time }
            modifierGroupIds: { type: array, items: { type: string, format: uuid } }
            comboSlots: { type: array, items: { $ref: '#/components/schemas/ComboSlot' } }

    AdminModifierGroup:
      allOf:
        - $ref: '#/components/schemas/ModifierGroup'
        - type: object
          required: [productCount]
          properties:
            productCount: { type: integer, minimum: 0, description: Productos activos que la usan }

    AdminSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [authenticated, expiresAt]
          properties:
            authenticated: { type: boolean }
            expiresAt: { type: [string, 'null'], format: date-time }

    ProductInput:
      oneOf:
        - type: object
          description: Requiere `priceClp` o al menos un tamaño (con tamaños, manda el precio de cada uno).
          required:
            [
              kind,
              categoryId,
              typeId,
              name,
              subtitle,
              description,
              priceClp,
              isAvailable,
              image,
              promotion,
              sizes,
              allergens,
              modifierGroupIds,
            ]
          properties:
            kind: { const: single }
            categoryId: { type: string, format: uuid }
            typeId: { type: [string, 'null'], format: uuid }
            name: { type: string, minLength: 1, maxLength: 80 }
            subtitle: { type: string, maxLength: 80 }
            description: { type: string, maxLength: 240 }
            priceClp: { type: [integer, 'null'], minimum: 0, maximum: 1000000 }
            isAvailable: { type: boolean }
            image:
              oneOf:
                - $ref: '#/components/schemas/ImageRefInput'
                - type: 'null'
            promotion:
              oneOf:
                - $ref: '#/components/schemas/Promotion'
                - type: 'null'
            sizes:
              type: array
              maxItems: 6
              description: Nombres únicos.
              items: { $ref: '#/components/schemas/SizeInput' }
            allergens:
              type: array
              uniqueItems: true
              items: { $ref: '#/components/schemas/Allergen' }
            modifierGroupIds:
              type: array
              uniqueItems: true
              maxItems: 10
              items: { type: string, format: uuid }
        - type: object
          required:
            [
              kind,
              categoryId,
              typeId,
              name,
              subtitle,
              description,
              priceClp,
              isAvailable,
              image,
              promotion,
              comboSlots,
            ]
          properties:
            kind: { const: combo }
            categoryId: { type: string, format: uuid }
            typeId: { type: [string, 'null'], format: uuid }
            name: { type: string, minLength: 1, maxLength: 80 }
            subtitle: { type: string, maxLength: 80 }
            description: { type: string, maxLength: 240 }
            priceClp: { type: integer, minimum: 0, maximum: 1000000 }
            isAvailable: { type: boolean }
            image:
              oneOf:
                - $ref: '#/components/schemas/ImageRefInput'
                - type: 'null'
            promotion:
              oneOf:
                - $ref: '#/components/schemas/Promotion'
                - type: 'null'
            comboSlots:
              type: array
              minItems: 1
              maxItems: 6
              description: Al menos un espacio obligatorio.
              items:
                type: object
                required: [name, isRequired, options]
                properties:
                  name: { type: string, minLength: 1, maxLength: 40 }
                  isRequired: { type: boolean }
                  options:
                    type: array
                    minItems: 1
                    maxItems: 20
                    description: Solo productos simples activos, sin repetir dentro del espacio.
                    items:
                      type: object
                      required: [productId, extraPriceClp]
                      properties:
                        productId: { type: string, format: uuid }
                        extraPriceClp: { type: integer, minimum: 0, maximum: 1000000 }
      discriminator:
        propertyName: kind

    ModifierGroupInput:
      type: object
      description: '`minSelections ≤ maxSelections ≤ options.length`; nombres de opción únicos.'
      required: [name, minSelections, maxSelections, options]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        minSelections: { type: integer, minimum: 0, maximum: 10 }
        maxSelections: { type: integer, minimum: 1, maximum: 10 }
        options:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [name, priceDeltaClp, isAvailable]
            properties:
              id:
                type: string
                format: uuid
                description: Envíalo al editar para conservar la identidad de la opción.
              name: { type: string, minLength: 1, maxLength: 40 }
              priceDeltaClp: { type: integer, minimum: 0, maximum: 1000000 }
              isAvailable: { type: boolean }

    ProductTypeInput:
      type: object
      description: |
        Plantilla. `kind: single` usa `sizes` y `modifierGroupIds`; `kind: combo` usa
        `comboSlots` (sin productos: cada combo elige los suyos).
      required: [name, description, kind, sizes, modifierGroupIds, comboSlots]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, maxLength: 160 }
        kind: { type: string, enum: [single, combo] }
        sizes: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/SizeInput' } }
        modifierGroupIds:
          type: array
          uniqueItems: true
          maxItems: 10
          items: { type: string, format: uuid }
        comboSlots:
          type: array
          maxItems: 6
          items:
            type: object
            required: [name, isRequired]
            properties:
              name: { type: string, minLength: 1, maxLength: 40 }
              isRequired: { type: boolean }

    ProductType:
      type: object
      required: [id, name, description, kind, sizes, modifierGroupIds, comboSlots, productCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [single, combo] }
        sizes:
          type: array
          items:
            type: object
            required: [name, priceClp, groupRules]
            properties:
              name: { type: string }
              priceClp: { type: integer, minimum: 0 }
              groupRules: { type: array, items: { $ref: '#/components/schemas/SizeGroupRule' } }
        modifierGroupIds: { type: array, items: { type: string, format: uuid } }
        comboSlots:
          type: array
          items:
            type: object
            required: [name, isRequired]
            properties:
              name: { type: string }
              isRequired: { type: boolean }
        productCount: { type: integer, minimum: 0, description: Productos activos creados con él }

    Menu:
      type: object
      required: [promotions, categories]
      properties:
        promotions:
          type: array
          description: Promociones vigentes hoy (también aparecen en su categoría).
          items: { $ref: '#/components/schemas/MenuProduct' }
        categories:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Category'
              - type: object
                required: [products]
                properties:
                  products: { type: array, items: { $ref: '#/components/schemas/MenuProduct' } }

    TableStatus:
      type: string
      enum: [free, occupied, awaiting-payment]
      description: |
        Derivado, no almacenado: `free` sin pedidos abiertos; `awaiting-payment` si todos
        los pedidos abiertos fueron entregados; `occupied` en otro caso.

    TableOverview:
      type: object
      required: [id, number, label, sortOrder, status, itemCount, openTotalClp, openSince]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        label: { type: string }
        sortOrder: { type: integer }
        status: { $ref: '#/components/schemas/TableStatus' }
        itemCount: { type: integer, minimum: 0 }
        openTotalClp: { type: integer, minimum: 0 }
        openSince: { type: [string, 'null'], format: date-time }

    OrderStatus:
      type: string
      enum: [new, preparing, ready, delivered, paid, cancelled]

    OrderChannel:
      type: string
      enum: [dine-in, takeaway, whatsapp]

    QuickNote:
      type: string
      enum: [no-sugar, takeaway, lactose-free, sweetener]

    OrderItemOption:
      type: object
      description: Opción o elección de combo, con nombre y precio al momento de la venta.
      required: [kind, label, name, priceDeltaClp]
      properties:
        kind: { type: string, enum: [size, modifier, combo] }
        label:
          type: string
          description: '«Tamaño», grupo («Salsas») o espacio del combo'
        name:
          { type: string, description: 'Tamaño («Grande»), opción («Pebre») o producto elegido' }
        priceDeltaClp: { type: integer, minimum: 0 }

    OrderItem:
      type: object
      required: [id, productId, productName, unitPriceClp, quantity, quickNotes, note, options]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string, description: Nombre al momento de la venta }
        unitPriceClp:
          type: integer
          minimum: 0
          description: |
            Precio base por unidad (el del tamaño elegido, si tiene); los extras van en
            `options`.
        quantity: { type: integer, minimum: 1, maximum: 99 }
        quickNotes: { type: array, items: { $ref: '#/components/schemas/QuickNote' } }
        note: { type: [string, 'null'], maxLength: 140 }
        options: { type: array, items: { $ref: '#/components/schemas/OrderItemOption' } }

    Order:
      type: object
      required:
        [
          id,
          channel,
          status,
          tableId,
          tableLabel,
          customerName,
          pickupAt,
          items,
          totalClp,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/OrderChannel' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        tableId: { type: [string, 'null'], format: uuid }
        tableLabel: { type: [string, 'null'] }
        customerName: { type: [string, 'null'], maxLength: 60 }
        pickupAt: { type: [string, 'null'], format: date-time }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderItem' } }
        totalClp: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateOrderInput:
      type: object
      required: [channel, items]
      description: '`dine-in` exige `tableId`; `whatsapp` exige `customerName`.'
      properties:
        channel: { $ref: '#/components/schemas/OrderChannel' }
        tableId: { type: [string, 'null'], format: uuid }
        customerName: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        pickupAt: { type: [string, 'null'], format: date-time }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 99 }
              quickNotes:
                type: array
                items: { $ref: '#/components/schemas/QuickNote' }
                default: []
              note: { type: [string, 'null'], maxLength: 140, default: null }
              sizeId:
                type: [string, 'null']
                format: uuid
                default: null
                description: |
                  Obligatorio si el producto tiene tamaños. Fija el precio y las reglas de
                  personalización que el servidor exige (mínimo y máximo por grupo).
              options:
                type: array
                default: []
                description: Personalizaciones elegidas; el servidor resuelve nombre y precio.
                items:
                  type: object
                  required: [groupId, optionId]
                  properties:
                    groupId: { type: string, format: uuid }
                    optionId: { type: string, format: uuid }
              comboChoices:
                type: array
                default: []
                description: |
                  Un producto por espacio; los espacios obligatorios deben venir, los opcionales
                  pueden omitirse.
                items:
                  type: object
                  required: [slotId, productId]
                  properties:
                    slotId: { type: string, format: uuid }
                    productId: { type: string, format: uuid }

    RealtimeEvent:
      oneOf:
        - type: object
          required: [type, payload]
          properties:
            type: { const: order.created }
            payload: { $ref: '#/components/schemas/Order' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: order.updated }
            payload: { $ref: '#/components/schemas/Order' }
        - type: object
          description: La carta cambió; los clientes vuelven a pedirla.
          required: [type]
          properties:
            type: { const: catalog.updated }
