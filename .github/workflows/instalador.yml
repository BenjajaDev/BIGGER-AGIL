name: Instalador Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [develop, main]
    paths:
      - installer/**
      - .github/workflows/instalador.yml
      - apps/api/src/scripts/setup.ts
      - apps/api/tsup.config.ts

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Determinar versión
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = '0.0.0-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Construir instalador
        shell: pwsh
        run: ./installer/build.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Prueba de humo
        shell: pwsh
        run: ./installer/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Instalar-BIGGER-Agil
          path: installer/Output/Instalar-BIGGER-Agil-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Instalar-BIGGER-Agil
          path: dist
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Instalar-BIGGER-Agil-*.exe \
            --title "BIGGER Ágil $GITHUB_REF_NAME" \
            --notes "Instalador de Windows (64 bits). Guía: docs/instalacion-windows.md"
